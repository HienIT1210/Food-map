name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  database:
    name: Database (M1+)
    runs-on: ubuntu-latest
    # Local Windows dev does not run Docker / supabase start.
    # This job is skipped until M1 adds SQL migrations.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - name: Start local database
        run: supabase start
      - name: Simulate Supabase Cloud migration (search_path = public)
        run: |
          CONTAINER=$(docker ps -q --filter "name=supabase_db" | head -n 1)
          # Clean public schema and restore default privileges / grants
          docker exec $CONTAINER psql -U postgres -d postgres -c "
            DROP SCHEMA IF EXISTS public CASCADE;
            CREATE SCHEMA public;
            GRANT ALL ON SCHEMA public TO postgres;
            GRANT ALL ON SCHEMA public TO public;
            GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
            DELETE FROM auth.users;
          "
          # Apply each migration file strictly under search_path = public
          for file in $(ls -1 supabase/migrations/*.sql | sort); do
            echo "Applying migration: $file with PGOPTIONS='-c search_path=public'..."
            docker exec -e PGOPTIONS="-c search_path=public" -i $CONTAINER psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
          # Apply seed under search_path = public
          if [ -f supabase/seed.sql ]; then
            echo "Applying seed with PGOPTIONS='-c search_path=public'..."
            docker exec -e PGOPTIONS="-c search_path=public" -i $CONTAINER psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seed.sql
          fi
          # Apply seed-cloud
          if [ -f supabase/seed-cloud.sql ]; then
            echo "Applying seed-cloud with PGOPTIONS='-c search_path=public'..."
            docker exec -e PGOPTIONS="-c search_path=public" -i $CONTAINER psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/seed-cloud.sql
          fi
      - name: Run pgTAP / RLS tests
        run: supabase test db
      # Diagnostic: `supabase test db` only summarises, so a file that emits fewer TAP lines than
      # its plan can hide WHICH assertion was skipped. This step runs the two files that carry the
      # numbered markers straight through psql so the log shows every `ok N - name` line and every
      # `>>> about to run A<nn>` trace, making a missing assertion identifiable. It does not gate
      # the build (no ON_ERROR_STOP): the step above is still the pass/fail signal.
      - name: Diagnostic - raw TAP lines for 01 and 10
        if: always()
        run: |
          for file in supabase/tests/01_rls_test.sql supabase/tests/10_m6_restaurant_creation_test.sql; do
            echo "===== RAW TAP: $file ====="
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f "$file" 2>&1 \
              | grep -E "about to run A|^(not )?ok [0-9]+|^# Failed test|^# Looks like" || true
          done
