name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  database:
    name: Database (M1+)
    runs-on: ubuntu-latest
    # Local Windows dev does not run Docker / supabase start.
    # This job is skipped until M1 adds SQL migrations.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - name: Start local database
        run: supabase start
      - name: Run pgTAP / RLS tests
        run: supabase test db
